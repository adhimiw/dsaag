[project]
name = "data-analytics-agent"
version = "0.1.0"
description = "Multi-agent data analytics platform with MCP integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=0.28.0",
    "mistralai>=1.0.0",
    "google-generativeai>=0.3.0",
    "mcp>=0.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

